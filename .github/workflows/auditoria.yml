name: Auditoria de navegação
on:
  workflow_dispatch:
  push:
    paths:
      - index.html
      - social-preview.png
      - qa/e2e.mjs
      - .github/workflows/auditoria.yml
permissions:
  contents: read
concurrency:
  group: auditoria-operacao
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node qa/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultado-auditoria
          path: qa-result.json
          if-no-files-found: warn
